[package]
name = "nrzbackup-server"
version = "1.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "nrzBackup server: receives backups, encrypts them client-side and stores them in Filen.io."

[dependencies]
nrzbackup-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Filen client-side encryption (AES-256-GCM, PBKDF2-SHA512, Argon2id, HKDF, HMAC)
aes-gcm = "0.10"
pbkdf2 = "0.12"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
mime_guess = "2"
tar = { version = "0.4", default-features = false }
flate2 = "1"
age = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
