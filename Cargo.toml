[package]
name = "nrzbackup"
version = "1.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "nrzBackup web app (Dioxus, nrzUI theme)."

[dependencies]
nrzbackup-shared = { path = "shared" }
dioxus = { version = "=0.7.10", features = ["router", "web"] }
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement",
  "Storage", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "File", "FileList",
  "Location", "Event", "DomTokenList", "History",
] }

[workspace]
members = ["shared", "server", "xtask"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.release.package.nrzbackup-server]
opt-level = 3
